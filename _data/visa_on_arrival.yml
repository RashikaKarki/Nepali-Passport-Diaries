# visa_on_arrival.yml — Destinations issuing a visa/permit ON ARRIVAL to Nepali passport holders

- country: Maldives
  iso: MV
  region: Asia
  status: visa_on_arrival
  duration: 30 days
  fee: Free
  conditions:
    - Passport/travel document valid ≥ 1 month (6 months recommended)
    - Confirmed accommodation and sufficient funds
    - Complete the IMUGA "Traveller Declaration" online within 96 hours before arrival
  extension: Extendable in-country up to 90 days total
  source:
    name: Maldives Immigration (IMUGA)
    url: https://imuga.immigration.gov.mv/
  proof:
    nepal_explicitly_named: false  # covered by an explicit ALL-nationalities policy
    url: https://www.immigration.gov.mv/visa/tourist-visa
    evidence: >
      Maldives Immigration (official) states the tourist visa is granted on arrival with no
      pre-approval; the Maldives MFA (foreign.gov.mv) states it is "granted for all
      nationalities on arrival" (Israeli passports excepted since Apr 2025), which covers
      Nepali passports.
    secondary_url: https://foreign.gov.mv/index.php/en/consular/for-foreigners-visiting-maldives/maldives-visa
  confidence: high
  verified: 2026-08-09
  verify_before_travel: true

- country: Cambodia
  iso: KH
  region: Asia
  status: visa_on_arrival
  duration: 30 days
  fee: "USD 30 (tourist T-visa) + possible processing"
  conditions:
    - Passport valid ≥ 6 months, one blank page, passport photo
    - Mandatory Cambodia e-Arrival Card (arrival.gov.kh) before arrival — free, required for ALL air arrivals
    - eVisa alternative available online (STRONGLY recommended for Nepali passports — see notes)
  notes: >
    Conflicting recent guidance: general sources (VisitWorld, Apr 2026) say VOA is available
    to Nepali citizens at Phnom Penh/Siem Reap airports and land borders, but Aug 2026
    Nepal-specific guidance referencing Cambodia's Honorary Consulate in Kathmandu warns
    Nepali applicants face extra scrutiny (~10 working days eVisa processing vs 3 for
    others) and advises NOT to rely on VOA. Get the T-class eVisa before booking.
  proof:
    nepal_explicitly_named: true
    url: https://visitworld.today/cambodia/nepal-citizenship/travel
    evidence: >
      Nepal-specific 2026 guidance confirms visitors from Nepal can generally obtain a visa
      on arrival at Phnom Penh and Siem Reap airports and at land checkpoints, with the
      official eVisa (evisa.gov.kh) as the safer alternative; the e-Arrival Card became
      mandatory for all international visitors from July 2024.
  extension: Extendable once in-country
  source:
    name: Cambodia eVisa (Ministry of Foreign Affairs)
    url: https://www.evisa.gov.kh/
  confidence: high
  verified: 2026-08-09
  verify_before_travel: true

- country: Laos
  iso: LA
  region: Asia
  status: visa_on_arrival
  duration: 30 days
  fee: "USD 30–45 VOA (cash) / USD 50 eVisa"
  conditions:
    - Available at Vientiane, Luang Prabang, Pakse airports, 4 Thai–Lao Friendship Bridges and 7 land crossings only
    - Passport photo + USD cash; eVisa alternative at laoevisa.gov.la
  proof:
    nepal_explicitly_named: false  # proof by omission from the Lao MFA exclusion list
    url: https://apply.joinsherpa.com/visa/laos/nepalese-citizens
    evidence: >
      The Lao MFA's VOA exclusion list (notice No. 1232 — Afghanistan, Algeria, Bangladesh,
      Pakistan, Nigeria and ~25 others who must apply at embassies) does NOT include Nepal.
      Current Nepal-specific sources (Sherpa airline-grade data; VisitWorld 2026) confirm
      Nepali citizens can use both VOA at listed checkpoints and the USD 50 tourist eVisa.
    secondary_url: https://visitworld.today/laos/nepal-citizenship/travel
  source:
    name: Lao eVisa (official)
    url: https://laoevisa.gov.la/
  confidence: high
  verified: 2026-08-09
  verify_before_travel: true

