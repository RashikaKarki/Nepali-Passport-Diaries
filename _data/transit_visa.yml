# transit_visa.yml — Countries where a Nepali passport needs a visa even to stay
# airside in the transit zone. `transit_visa` entries can be unlocked by a held
# visa; `transit_visa_restricted` entries require a visa with no exemption.

- country: United Kingdom
  iso: GB
  region: Europe
  status: transit_visa
  requires: A valid visa or permanent residence for the US, Canada, Australia or New Zealand; an EEA/Switzerland residence permit or long-stay "D" visa; or a valid Irish biometric visa
  benefit: Change flights airside without a Direct Airside Transit Visa (DATV)
  held_visas: [US, Canada, Australia, New Zealand, Ireland]
  duration: Airside transit only (same day, same airport)
  conditions:
    - You arrive and leave by air, depart the same day from the same airport, and hold the documents for your onward destination
    - Exempt with a valid Australia, Canada, New Zealand or USA visa — you need not be flying to or from that country
    - Exempt with permanent residence of Australia, Canada, New Zealand or the USA (date/document conditions apply for the US and Canada)
    - Exempt with an EEA/Switzerland residence permit or long-stay "D" visa
    - Exempt with a valid Irish biometric visa marked BC or BC BIVS, unless your destination is Ireland
    - E-visas or e-residence permits count only if the airline can verify them; the Border Force officer makes the final decision
  proof:
    nepal_explicitly_named: false  # DATV list is by document type / route, not nationality
    url: https://www.gov.uk/transit-visa/direct-airside-transit-visa
    evidence: >
      GOV.UK (UK Home Office) sets the DATV exemptions by document held: a valid US, Canada,
      Australia or New Zealand visa or permanent residence, an EEA/Switzerland residence permit
      or category-D visa, or an Irish BC/BC BIVS biometric visa. Nepali passport holders without
      one of these need a DATV to transit airside.
  source:
    name: UK Home Office (GOV.UK) — Direct Airside Transit Visa
    url: https://www.gov.uk/transit-visa/direct-airside-transit-visa
  confidence: high
  verified: 2026-09-26

- country: Spain
  iso: ES
  region: Europe
  status: transit_visa
  requires: A valid Schengen visa or any visa/residence card allowing return to an EU/EEA state or Switzerland; or a residence card of Andorra, Canada, the US, Japan or San Marino
  benefit: Pass through the international zone of a Spanish airport without a Schengen Airport Transit Visa (ATV, Type A)
  held_visas: [Schengen, Canada, US, Japan]
  duration: Airside transit up to 24 hours
  conditions:
    - Nepal (ordinary passports) was added to Spain's ATV list effective 21 April 2025; diplomatic and official passports are exempt
    - Exempt with a Schengen visa, or any visa or residence card allowing return to an EU/EEA state or Switzerland
    - Exempt with a residence card of Andorra, Canada, the US, Japan or San Marino
    - If your bags are not checked through to the final destination, a full Schengen (Type C) visa is needed
    - At Madrid, moving from Terminal 1 to Terminal 4S does not count as entering Schengen
  proof:
    nepal_explicitly_named: true
    url: https://www.exteriores.gob.es/Consulados/washington/en/ServiciosConsulares/Paginas/Consular/Visado-de-transito-aeroportuario.aspx
    evidence: >
      Verified 2026-09-26 against the page: Spain's Ministry of Foreign Affairs lists Nepal among
      the nationalities that need a Type A airport transit visa to pass through the international
      zone of a Spanish airport, and exempts holders of a Schengen visa or Member-State residence
      card, a residence card of Andorra, Canada, the US, Japan or San Marino, diplomatic passport
      holders, EU/EEA family members and flight crew. (The 21 April 2025 start date is reported by
      Spain's MFA and BLS but is not stated on this consular page.)
  source:
    name: Ministry of Foreign Affairs of Spain — Airport transit visa
    url: https://www.exteriores.gob.es/Consulados/washington/en/ServiciosConsulares/Paginas/Consular/Visado-de-transito-aeroportuario.aspx
  confidence: high
  verified: 2026-09-26

