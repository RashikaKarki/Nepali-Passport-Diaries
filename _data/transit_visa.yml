- country: Mexico
  iso: MX
  region: Americas
  status: transit_visa
  requires: A valid visa or permanent residence from the US, Canada, Japan, the UK or a Schengen state (or permanent residence of a Pacific Alliance state)
  benefit: Connect through a Mexican airport without a Mexican visa
  held_visas: [US, Canada, Japan, UK, Schengen]
  duration: Airport connection
  conditions:
    - Since 22 October 2023, visa-national passengers connecting through a Mexican airport must already hold the required document before boarding
    - Exempt with a valid visa or permanent residence from the US, Canada, Japan, the UK or a Schengen country
    - Official wording is "valid and current"; a used multiple-entry visa is the safest option
  proof:
    nepal_explicitly_named: false  # rule applies by document held, to all visa nationals
    url: https://www.gob.mx/sre/prensa/information-for-foreign-nationals-transiting-through-mexico-s-airports?idiom=en
    evidence: >
      Mexico's Secretariat of Foreign Affairs (SRE, gob.mx) states that since 22 October 2023 any
      foreign national connecting through a Mexican airport must hold a Mexican visa unless they
      carry a valid visa or permanent residence from the US, Canada, Japan, the UK or a Schengen
      state — the rule is nationality-agnostic and so covers Nepali passports.
  source:
    name: Secretariat of Foreign Affairs of Mexico (SRE) — Transiting through Mexico's airports
    url: https://www.gob.mx/sre/prensa/information-for-foreign-nationals-transiting-through-mexico-s-airports?idiom=en
  confidence: high
  verified: 2026-09-26

- country: New Zealand
  iso: NZ
  region: Oceania
  status: transit_visa
  requires: An NZeTA (accepted only when transiting to or from Australia) or a valid New Zealand visa
  benefit: Transit Auckland Airport without a Transit Visa
  held_visas: [Australia]
  duration: Transit under 24 hours, Auckland only
  conditions:
    - Nepal is not on New Zealand's transit-visa waiver list
    - You may use an NZeTA instead of a Transit Visa only if you are transiting to or from Australia
    - Only Auckland has a transit area; you must stay under 24 hours and remain airside — no baggage collection and no accommodation
    - A valid New Zealand visa also covers transit
  proof:
    nepal_explicitly_named: false  # transit-waiver list is by nationality/route
    url: https://www.immigration.govt.nz/visit/transiting-through-new-zealand/
    evidence: >
      Immigration New Zealand states that travellers not from a transit-visa-waiver country need
      a Transit Visa to transit Auckland, and may instead use an NZeTA only when transiting to or
      from Australia. Nepal is not on the waiver list.
  source:
    name: Immigration New Zealand — Transiting through New Zealand
    url: https://www.immigration.govt.nz/visit/transiting-through-new-zealand/
  confidence: high
  verified: 2026-09-26

- country: United States
  iso: US
  region: Americas
  status: transit_visa_restricted
  benefit: None — a C-1 transit visa (or a B-1/B-2) is always required; there is no visa-free transit for Nepali passport holders
  duration: Not available — visa required for any connection
  conditions:
    - The Transit Without Visa program was suspended in 2003 and has never been restored
    - Only Visa Waiver Program nationals can transit without a visa; Nepal is not a VWP country
    - Apply for a C-1 transit visa (or a B-1/B-2 visitor visa) before travelling
  proof:
    nepal_explicitly_named: false  # applies to all non-VWP visa nationals
    url: https://travel.state.gov/content/travel/en/us-visas/other-visa-categories/transit.html
    evidence: >
      The US Department of State (travel.state.gov) requires a C-1 transit visa for immediate and
      continuous transit through the United States, with no transit-without-visa exemption for
      nationals who normally need a visa, such as Nepalis.
  source:
    name: U.S. Department of State — Transit (C) visas
    url: https://travel.state.gov/content/travel/en/us-visas/other-visa-categories/transit.html
  confidence: high
  verified: 2026-09-26

