- country: Ireland
  iso: IE
  region: Europe
  status: transit_visa_restricted
  benefit: None in practice — Nepal needs an Irish transit visa, and almost every connection requires a full entry visa
  duration: Airside only in Dublin Terminal 2, 04:00–20:00 same day
  conditions:
    - Nepal is on Ireland's transit-visa-required list
    - A connection counts as airside only if both flights are in Dublin Terminal 2, between 04:00 and 20:00, on the same day
    - Any other connection requires a full Irish entry visa; Irish airports also close overnight
  proof:
    nepal_explicitly_named: false  # this page states the rule; Nepal is on Ireland's separate transit-visa list
    url: https://www.irishimmigration.ie/at-the-border/transit-including-transfer-visa-advice/
    evidence: >
      Irish Immigration Service (irishimmigration.ie) states transit-visa-required nationals need
      an Irish transit visa, and that a connection is treated as airside only when both flights
      are in Dublin Terminal 2 between 04:00 and 20:00 the same day — otherwise a full entry visa
      is required. Nepal is on Ireland's transit-visa-required list.
  source:
    name: Irish Immigration Service — Transit (including transfer) visa advice
    url: https://www.irishimmigration.ie/at-the-border/transit-including-transfer-visa-advice/
  confidence: medium
  verified: 2026-09-26
