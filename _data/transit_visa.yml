    - The Transit Without Visa and China Transit programs do not cover Nepal
    - The transit visa is free but must be obtained before travelling
  proof:
    nepal_explicitly_named: false  # applies to all visa-required nationals
    url: https://www.canada.ca/en/immigration-refugees-citizenship/services/visit-canada/transit/transit-visa/who-needs-transit-visa.html
    evidence: >
      Immigration, Refugees and Citizenship Canada (canada.ca) states that visa-required
      nationals need a (free) transit visa to transit a Canadian airport, and that the visa-free
      transit programs cover only specific nationalities and US-bound routes — not Nepal.
  source:
    name: Immigration, Refugees and Citizenship Canada — Who needs a transit visa
    url: https://www.canada.ca/en/immigration-refugees-citizenship/services/visit-canada/transit/transit-visa/who-needs-transit-visa.html
  confidence: high
  verified: 2026-09-26

