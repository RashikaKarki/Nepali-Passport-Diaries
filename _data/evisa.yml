- country: Thailand
  iso: TH
  region: Asia
  status: evisa
  duration: 60 days (Tourist Visa TR, single entry)
  fee: "Approx. USD 40 / NPR 5,000 single entry"
  conditions:
    - All applications via the official Thai eVisa platform since 1 Jan 2025
    - Processing ≥ 7 working days — apply 3–4 weeks ahead
    - Mandatory Thailand Digital Arrival Card (TDAC) within 72 hours before arrival
  notes: >
    Nepal historically appeared on Thailand's 15-day visa-on-arrival list (THB 2,000 cash),
    but as of mid-2026 sources conflict — Thailand tightened visa rules in May 2026 and
    Nepal-based agencies report Nepal is NOT currently on the VOA list. Do not fly on the
    assumption of VOA; get the eVisa.
  source:
    name: Royal Thai Government eVisa (official)
    url: https://www.thaievisa.go.th/
  proof:
    nepal_explicitly_named: true
    url: https://kathmandu.thaiembassy.org/en/page/general-information?menu=6115eec487437e2f2256abe2
    evidence: >
      Royal Thai Embassy Kathmandu (official) states that from 1 Jan 2025 all Nepali and
      foreign nationals in Nepal must apply via thaievisa.go.th, with the fee deposited via
      Global IME Bank Manager's Cheque, and that only Nepali OFFICIAL (not ordinary)
      passport holders are visa-exempt — confirming ordinary Nepali passports need a visa.
  confidence: high
  verified: 2026-08-09

