# visa_free.yml — Destinations Nepali passport holders can enter without obtaining a visa

- country: India
  iso: IN
  region: Asia
  status: freedom_of_movement
  duration: Unlimited (live and work)
  conditions:
    - No passport/visa needed at the open border; carry citizenship certificate, voter ID, or passport
    - Flying requires an approved photo ID (passport or Nepali citizenship certificate)
  legal_basis: 1950 Indo-Nepal Treaty of Peace and Friendship
  source:
    name: Ministry of External Affairs, India — Indo-Nepal Treaty
    url: https://mea.gov.in/bilateral-documents.htm?dtl/6295/Treaty+of+Peace+and+Friendship
  confidence: high
  checked: 2026-08-09
  verify_before_travel: true

- country: Singapore
  iso: SG
  region: Asia
  status: visa_free
  duration: Typically 30 days (social visit pass, exact stay set by ICA officer on the e-Pass)
  conditions:
    - Passport valid ≥ 6 months
    - Submit the SG Arrival Card (SGAC) online within 3 days before arrival — free, at ica.gov.sg (beware paid third-party sites)
    - Onward/return ticket, proof of funds and accommodation; entry is at officer's discretion
  proof:
    nepal_explicitly_named: false  # proof by omission from ICA's exhaustive visa-required list
    url: https://www.ica.gov.sg/enter-transit-depart/entering-singapore/visa_requirements
    evidence: >
      ICA's official "Check if You Need an Entry Visa" page enumerates every nationality
      that requires a Singapore visa (Afghanistan, Bangladesh, India, Pakistan, etc.) —
      Nepal does NOT appear on the list, and under ICA's framework travellers not on the
      list are visa-exempt for short visits. Multiple 2025–2026 sources confirm 30-day
      visa-free entry for Nepali passports with the SG Arrival Card.
  notes: >
    This reflects a change — Nepal was previously on Singapore's visa-required
    (assessment-level) list, and some Nepal-based agency websites still describe the old
    SGD 30 agent-based visa process. Before booking, re-check the ICA page above and/or
    run your passport through ICA's official e-Service; if the ICA list ever re-adds
    Nepal, the agent/e-visa route applies again.
  source:
    name: Immigration & Checkpoints Authority (ICA), Singapore — visa requirements
    url: https://www.ica.gov.sg/enter-transit-depart/entering-singapore/visa_requirements
  confidence: high
  verified: 2026-08-09
  verify_before_travel: true

- country: Philippines
  iso: PH
  region: Asia
  status: visa_free
  duration: 30 days (extendable in-country at the Bureau of Immigration)
  conditions:
    - Passport valid ≥ 6 months beyond stay
    - Return or onward ticket within the 30-day limit (strictly checked at check-in)
    - Complete the free eTravel registration (etravel.gov.ph) before departure
    - Proof of funds may be requested
  proof:
    nepal_explicitly_named: true
    url: https://www.vinavisas.com/philippines-tourist-visa-exemption/npl-nepal
    evidence: >
      Nepal appears on the Philippine DFA's executive-order list of nationalities that may
      enter without a visa for stays up to 30 days. Multiple current (2026) sources —
      including DFA-derived exemption lists and Nepal-specific travel guidance — uniformly
      confirm 30-day visa-free entry for Nepali passports with onward ticket + eTravel.
    secondary_url: https://visitworld.today/philippines/nepal-citizenship/travel
  source:
    name: Philippine Department of Foreign Affairs — visa-free entry guidelines
    url: https://dfa.gov.ph/list-of-countries-for-21-day-visa
  confidence: high
  verified: 2026-08-09
  verify_before_travel: true

- country: Micronesia (Federated States)
  iso: FM
  region: Oceania
  status: visa_free
  duration: 30 days (extendable in-country up to 60 days)
  conditions:
    - Passport valid ≥ 120 days beyond entry
    - Onward/return ticket; FSM arrival/departure record completed via carrier
  proof:
    nepal_explicitly_named: false  # universal policy covers Nepal
    url: https://en.wikipedia.org/wiki/Visa_policy_of_Micronesia
    evidence: >
      FSM policy (per its official visitor guidance) requires no visa for tourists of ANY
      nationality staying 30 days or less — only a valid passport (120+ days) and onward
      ticket — extendable to 60 days. A universal policy that covers Nepali passports.
  source:
    name: FSM Division of Immigration
    url: https://gov.fm/index.php/component/content/article/35-fsm-government/executive/94-immigration
  confidence: high
  verified: 2026-08-09
  verify_before_travel: true

