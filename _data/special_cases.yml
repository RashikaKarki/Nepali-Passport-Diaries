# special_cases.yml — Extra access a Nepali passport gets when paired with another country's visa

- country: Mexico
  iso: MX
  region: Americas
  status: special
  requires: A valid visa (any category) from the US, Canada, Japan, the UK, or a Schengen state — or permanent residence of those countries or a Pacific Alliance state
  benefit: Enter Mexico without a Mexican visa for tourism, transit, or business
  held_visas: [US, Canada, Japan, UK, Schengen]
  duration: Up to 180 days (officer's discretion)
  conditions:
    - Supporting visa must be valid (unexpired) and affixed in the passport on the date of entry
    - Some Mexican consulates specify MULTIPLE-ENTRY visas, and airlines may require the visa
      to have been used at least once to enter the issuing country — safest with a used
      multiple-entry US/UK/Schengen/Canada/Japan visa
    - Expired US visa + EAD card / I-797 / I-20 / DS-2019 / Advance Parole does NOT qualify
    - Complete the FMM/entry registration as directed
  proof:
    nepal_explicitly_named: false  # rule is explicitly nationality-agnostic
    url: https://consulmex.sre.gob.mx/toronto/index.php/en/servicesforeigners/doclegalization/52-conservices/225-visitors-who-do-not-require-a-visa-with-a-stay-up-to-180-days
    evidence: >
      Official Mexican consulate (SRE, gob.mx domain) states that ALL foreign visitors,
      regardless of nationality, travelling for tourism, business or transit are exempt from
      a Mexican visa if they hold a valid visa issued by Canada, Japan, the USA, the UK or
      a Schengen country — "regardless of nationality" covers Nepali passports.
  source:
    name: Consulate of Mexico (SRE) — visitors who do not require a visa
    url: https://consulmex.sre.gob.mx/toronto/index.php/en/servicesforeigners/doclegalization/52-conservices/225-visitors-who-do-not-require-a-visa-with-a-stay-up-to-180-days
  confidence: high
  verified: 2026-08-09

- country: Georgia
  iso: GE
  region: Asia
  status: special
  requires: A valid visa OR residence permit from the US, UK, Japan, Canada, Australia, New Zealand, Israel, South Korea, a Schengen state, or a GCC state
  benefit: Visa-free entry with a valid visa or residence permit from any listed country
  held_visas: [US, UK, Japan, Canada, Australia, New Zealand, Israel, South Korea, Schengen, GCC]
  duration: 90 days
  conditions:
    - Supporting visa/permit must be valid at entry; carry the physical document
  proof:
    nepal_explicitly_named: false  # rule applies to all visa-required nationals, incl. Nepal
    url: https://www.geoconsul.gov.ge/en/entering-georgia/
    evidence: >
      Consular Dept of the Georgian MFA (official) publishes the rule that holders of valid
      visas or residence permits of the listed countries may enter and stay 90 days in any
      180-day period without a Georgian visa; Georgia's national tourism portal
      (georgia.travel) separately names Nepal among visa-required nationalities, confirming
      this shortcut is what applies to ordinary Nepali passports.
    caveat: Travellers relying on GCC residence permits have reported occasional refusals;
      a US/UK/Schengen/Japan/Canada/Australia/NZ/Israel/Korea visa or permit is safer.
  source:
    name: Consular Department, MFA of Georgia
    url: https://www.geoconsul.gov.ge/en/entering-georgia/
  confidence: high
  verified: 2026-08-09

