name: Validate data

on:
  pull_request:
    paths: ["_data/**", "scripts/**"]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml requests pytest
      - run: python -m pytest tests/ -q
      - run: python scripts/validate_data.py --check-urls
