name: Issue to PR

on:
  issues:
    types: [opened]

jobs:
  create-pr:
    if: contains(github.event.issue.labels.*.name, 'entry-submission')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - id: apply
        run: python scripts/issue_to_pr.py
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
      - uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        id: pr
        with:
          branch: data/issue-${{ github.event.issue.number }}
          title: "${{ github.event.issue.title }}"
          commit-message: "data: ${{ github.event.issue.title }} (#${{ github.event.issue.number }})"
          body: |
            Automated PR from #${{ github.event.issue.number }}.

            Closes #${{ github.event.issue.number }}
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = "${{ steps.pr.outputs.pull-request-url }}";
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Thanks! I opened a pull request from this submission: ${pr}. A maintainer will review it against the official source.`,
            });
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: "I couldn't turn this submission into a pull request — most likely a required field is missing or malformed. Please edit the issue to fix it, then a maintainer will re-trigger me, or open the change as a direct PR (see CONTRIBUTING.md).",
            });
